<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="t d">
<title id="t">Architecture of payments-reconciliation</title>
<desc id="d">The Day simulator drives payments through the Provider stub and writes the Settlement report file. The Matching job reads the report and the Your ledger tables, joins on the provider's transaction id and classifies each difference by cause. Timing and fees are cleared by rules and Real breaks are fixed from the report, both writing balanced entries back to the ledger. Breaks that need a person go to the Worklist, and the Daily report reads them.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="839" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="838" rx="16"/>
<text class="title" x="48" y="68">Two records of one day, joined on the provider's id</text>
<text class="caption" x="48" y="100">Every difference is classified, then fixed from the report or sent to a person. Amber: the one nobody can decide.</text>
<rect class="svc" x="48" y="176" width="252" height="84" rx="12"/>
<text class="name" x="64" y="208">Day simulator</text>
<text class="sub" x="64" y="232">RecordCapture path</text>
<text class="sub" x="64" y="254">plants six breaks</text>
<rect class="svc" x="440" y="176" width="260" height="84" rx="12"/>
<text class="name" x="456" y="208">Provider</text>
<text class="sub" x="456" y="232">stub: captures, refunds</text>
<text class="sub" x="456" y="254">closes the batch</text>
<path class="store" d="M48 352a130 12 0 0 1 260 0v102a130 12 0 0 1 -260 0z"/>
<path class="rim" d="M48 352a130 12 0 0 0 260 0"/>
<text class="name" x="178" y="389" text-anchor="middle">Settlement report</text>
<text class="sub" x="178" y="413" text-anchor="middle">settlement_YYYY-MM-DD.csv</text>
<text class="sub" x="178" y="437" text-anchor="middle">one row per settled txn</text>
<rect class="svc" x="456" y="340" width="260" height="112" rx="12"/>
<text class="name" x="472" y="372">Matching job</text>
<text class="sub" x="472" y="396">join on provider_txn_id</text>
<text class="sub" x="472" y="418">classify by cause</text>
<text class="sub" x="472" y="440">reconcile() is pure</text>
<rect class="svc" x="880" y="176" width="256" height="84" rx="12"/>
<text class="name" x="896" y="208">Timing and fees</text>
<text class="sub" x="896" y="232">carry, fee correction</text>
<path class="store" d="M868 352a140 12 0 0 1 280 0v102a140 12 0 0 1 -280 0z"/>
<path class="rim" d="M868 352a140 12 0 0 0 280 0"/>
<text class="name" x="1008" y="389" text-anchor="middle">Your ledger</text>
<text class="sub" x="1008" y="413" text-anchor="middle">payments, postings</text>
<text class="sub" x="1008" y="437" text-anchor="middle">append-only, balanced</text>
<rect class="svc" x="880" y="520" width="256" height="112" rx="12"/>
<text class="name" x="896" y="552">Real breaks</text>
<text class="sub" x="896" y="576">missing capture</text>
<text class="sub" x="896" y="598">duplicate, refund</text>
<text class="sub" x="896" y="620">fixed from the report</text>
<path class="store" d="M420 532a150 12 0 0 1 300 0v102a150 12 0 0 1 -300 0z"/>
<path class="rim" d="M420 532a150 12 0 0 0 300 0"/>
<text class="name" x="570" y="569" text-anchor="middle">Worklist</text>
<text class="sub" x="570" y="593" text-anchor="middle">reconciliation_breaks</text>
<text class="sub" x="570" y="617" text-anchor="middle">amount mismatch, overdue</text>
<rect class="svc" x="48" y="520" width="252" height="84" rx="12"/>
<text class="name" x="64" y="552">Daily report</text>
<text class="sub" x="64" y="576">matched, fixed, open</text>
<text class="sub" x="64" y="598">balance proof</text>
<rect class="note" x="420" y="680" width="340" height="100" rx="10"/>
<text class="label b t-warn" x="436" y="710">amount mismatch: ptx_0400</text>
<text class="sub" x="436" y="736">captured 95.00, settled 99.99</text>
<text class="sub" x="436" y="758">stays on the worklist: 4.99</text>
<path class="sync" d="M300 218H440"/>
<text class="label t-accent" x="312" y="208">captures</text>
<path class="async" d="M174 260V340"/>
<text class="label t-accent" x="186" y="306">writes the day's file</text>
<path class="read" d="M308 400H456"/>
<text class="label t-ink" x="316" y="390">rows of the day</text>
<path class="read" d="M868 400H716"/>
<text class="label t-ink" x="728" y="390">day's payments</text>
<text class="label t-ink" x="728" y="420">+ carried</text>
<path class="sync" d="M716 364H768Q780 364 780 352V242Q780 230 792 230H880"/>
<text class="label t-accent" x="796" y="220">timing</text>
<path class="sync" d="M716 436H768Q780 436 780 448V564Q780 576 792 576H880"/>
<text class="label t-accent" x="796" y="566">fixable</text>
<path class="sync" d="M586 452V520"/>
<text class="label t-accent" x="598" y="492">needs a person</text>
<path class="sync" d="M1008 260V340"/>
<text class="label t-accent" x="1020" y="296">balanced</text>
<text class="label t-accent" x="1020" y="316">fee entry</text>
<path class="sync" d="M1008 520V466"/>
<text class="label t-accent" x="1020" y="490">balanced</text>
<text class="label t-accent" x="1020" y="510">entries, once</text>
<path class="read" d="M420 570H300"/>
<text class="label t-ink" x="332" y="560">breaks</text>
<path class="sync" d="M48 796H112"/><text class="legend" x="124" y="801">sync call</text>
<path class="async" d="M264 796H328"/><text class="legend" x="340" y="801">async message</text>
<path class="read" d="M520 796H584"/><text class="legend" x="596" y="801">read</text>
</svg>
