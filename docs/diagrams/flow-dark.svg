<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">One run of make run in payments-reconciliation</title>
<desc id="d">The Day simulator runs a clean day of 500 payments and the Matching job finds nothing. A planted day of six causes goes through the same capture path and the job stores six breaks. Resolution fixes the missing capture, the duplicate, the fee and the refund from the settlement report, one transaction per break, and a second run changes nothing. The daily report balances with 4.99 open, all of it the amount mismatch, and the next day clears the carried timing break.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="759" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="758" rx="16"/>
<text class="title" x="48" y="68">A planted day: six breaks, fixed once, balanced</text>
<text class="caption" x="48" y="100">Amber: the six breaks. Resolution uses only the report. The second resolve and the ledger digest prove it is once.</text>
<rect class="svc" x="405" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="460" y="148" text-anchor="middle">Day</text>
<text class="lane" x="460" y="168" text-anchor="middle">simulator</text>
<rect class="svc" x="545" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="610" y="148" text-anchor="middle">Settlement</text>
<text class="lane" x="610" y="168" text-anchor="middle">report</text>
<rect class="svc" x="705" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="760" y="148" text-anchor="middle">Matching</text>
<text class="lane" x="760" y="168" text-anchor="middle">job</text>
<rect class="svc" x="840" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="910" y="158" text-anchor="middle">Your ledger</text>
<rect class="svc" x="1025" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="1080" y="148" text-anchor="middle">Daily</text>
<text class="lane" x="1080" y="168" text-anchor="middle">report</text>
<path class="hair" d="M460 176V368M610 176V304M760 176V688M910 176V688M1080 176V432"/>
<path class="hair" d="M66 216V664"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">A clean day, 500 payments</text>
<text class="sub" x="96" y="232">capture path, then the file</text>
<path class="sync" d="M460 216H910"/>
<text class="label t-accent" x="772" y="206">RecordCapture</text>
<circle class="dot" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">The job finds nothing</text>
<text class="sub" x="96" y="296">500 of 500 matched, 0 breaks</text>
<path class="read" d="M610 280H760"/>
<text class="label t-ink" x="620" y="270">rows of the day</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">The planted day, six causes</text>
<text class="sub" x="96" y="360">2026-10-20, same capture path</text>
<path class="sync" d="M460 344H910"/>
<text class="label t-accent" x="772" y="334">RecordCapture</text>
<circle class="dot-w" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-warn" x="96" y="404">Six breaks found</text>
<text class="sub" x="96" y="424">timing to amount mismatch</text>
<path class="fail" d="M760 408H910"/>
<text class="label t-warn" x="772" y="398">store breaks</text>
<circle class="dot" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">Resolve from the report</text>
<text class="sub" x="96" y="488">one transaction per break, locked</text>
<path class="sync" d="M760 472H910"/>
<text class="label t-accent" x="772" y="462">resolve</text>
<circle class="dot" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="532">Resolve again</text>
<text class="sub" x="96" y="552">already resolved, digest same</text>
<path class="sync" d="M760 536H910"/>
<text class="label t-accent" x="772" y="526">digest same</text>
<circle class="dot" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="596">The daily report balances</text>
<text class="sub" x="96" y="616">open 4.99, all of it ptx_0400</text>
<path class="sync" d="M760 600H1080"/>
<text class="label t-accent" x="922" y="590">balance proof</text>
<circle class="dot-g" cx="66" cy="664" r="15"/>
<text class="num" x="66" y="669" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="660">The next day clears the carry</text>
<text class="sub" x="96" y="680">ptx_0050 CLEARED; ptx_0400 stays</text>
<path class="sync" d="M760 664H910"/>
<text class="label t-accent" x="772" y="654">CLEARED</text>
<path class="ok" d="M760 664H708"/>
<rect class="win" x="424" y="644" width="284" height="40" rx="10"/>
<text class="label b t-good" x="440" y="669">worklist holds ptx_0400 only</text>
<path class="sync" d="M48 716H112"/><text class="legend" x="124" y="721">sync call</text>
<path class="read" d="M520 716H584"/><text class="legend" x="596" y="721">read</text>
<path class="ok" d="M928 716H992"/><text class="legend" x="1004" y="721">result</text>
</svg>
